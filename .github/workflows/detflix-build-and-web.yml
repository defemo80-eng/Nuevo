name: DETFLIX Build APK & Admin Web

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_apk:
    name: Compilar DETFLIX APP (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle 9.3.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Preparar licencias y debug.keystore
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          base64 -d debug.keystore.base64 > debug.keystore

      - name: Compilar APK Debug de DETFLIX
        run: gradle :app:assembleDebug --no-daemon

      - name: Subir APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: DETFLIX-APP-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  package_admin_web:
    name: Validar y Empaquetar DETFLIX ADMIN WEB
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar sintaxis de DETFLIX ADMIN WEB
        run: node --check admin-web/app.js

      - name: Subir paquete Web Administrativo
        uses: actions/upload-artifact@v4
        with:
          name: DETFLIX-ADMIN-WEB
          path: admin-web/
          if-no-files-found: error
