name: DETFLIX Build APK & Admin Web

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_apk:
    name: Compilar DETFLIX APP (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK 36.1 y Gradle 9.3.1
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ] || [ ! -w "$SDK_DIR" ]; then
            SDK_DIR="$RUNNER_TEMP/android-sdk"
            mkdir -p "$SDK_DIR"
          fi
          SDKMANAGER="$(command -v sdkmanager 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_DIR" /usr/local/lib/android/sdk -name sdkmanager -type f 2>/dev/null | head -n1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            mkdir -p "$SDK_DIR/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/cmdline-tools.zip"
            unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$SDK_DIR/cmdline-tools"
            mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"
          set -o pipefail

          mkdir -p "$RUNNER_TEMP/gradle"
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Preparar debug.keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Compilar APKs (DETFLIX APP y DETFLIX ADMIN)
        run: gradle :app:assembleDebug :admin-app:assembleDebug --no-daemon

      - name: Subir DETFLIX APP (APK Clientes)
        uses: actions/upload-artifact@v4
        with:
          name: DETFLIX-APP-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Subir DETFLIX ADMIN (APK Control)
        uses: actions/upload-artifact@v4
        with:
          name: DETFLIX-ADMIN-APK
          path: admin-app/build/outputs/apk/debug/admin-app-debug.apk
          if-no-files-found: error

  package_admin_web:
    name: Validar y Empaquetar DETFLIX ADMIN WEB
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar sintaxis de DETFLIX ADMIN WEB
        run: node --check admin-web/app.js

      - name: Subir paquete Web Administrativo
        uses: actions/upload-artifact@v4
        with:
          name: DETFLIX-ADMIN-WEB
          path: admin-web/
          if-no-files-found: error
